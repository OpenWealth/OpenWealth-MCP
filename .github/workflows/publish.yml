name: Publish to PyPI

# Two independent trigger paths:
#
#   workflow_dispatch  →  bump-and-tag job only
#                         Creates a release/vX.Y.Z branch, bumps __version__ +
#                         CHANGELOG, pushes a vX.Y.Z tag, and opens a PR to main.
#                         The tag push then fires the second path automatically.
#
#   push: tags v*      →  build → publish-testpypi → publish-pypi
#                         Builds the wheel/sdist and publishes to PyPI.
#                         Works for both automated releases and manual tag pushes.
#
# This split avoids pushing directly to the protected main branch and prevents
# double-publishing (build does NOT run on workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when 'version' is set)"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Exact version to release, e.g. 1.0.0 (overrides 'bump')"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── Job 1: bump version on a release branch, push tag, open PR ─────────────
  # Runs ONLY on workflow_dispatch; skipped on direct tag push.
  bump-and-tag:
    name: Bump version & create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install package to read current version
        run: uv sync --frozen

      - name: Compute new version
        id: bump
        run: |
          # Read current version and strip pre-release suffixes (e.g. "0.3.0b1" → "0.3.0")
          CURRENT=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openwealth-mcp'))")
          BASE=$(echo "$CURRENT" | grep -oP '^\d+\.\d+\.\d+')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          EXPLICIT="${{ inputs.version }}"
          BUMP_TYPE="${{ inputs.bump }}"

          if [ -n "$EXPLICIT" ]; then
            NEW_VER="$EXPLICIT"
          elif [ "$BUMP_TYPE" = "major" ]; then
            NEW_VER="$((MAJOR+1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VER="${MAJOR}.$((MINOR+1)).0"
          else
            NEW_VER="${MAJOR}.${MINOR}.$((PATCH+1))"
          fi

          echo "Bumping ${CURRENT} → ${NEW_VER}"
          echo "new_version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Create release branch and bump files
        id: release-branch
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          BRANCH="release/v${NEW_VER}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Bump __version__ (single source of truth)
          sed -i "s/__version__ = \".*\"/__version__ = \"${NEW_VER}\"/" \
              src/openwealth_mcp/__init__.py

          # Promote [Unreleased] → [x.y.z] in CHANGELOG
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/## \[Unreleased\]/## [${NEW_VER}] — ${TODAY}/" CHANGELOG.md

          # Insert a fresh [Unreleased] section above the new release header
          LINE=$(grep -n "## \[${NEW_VER}\]" CHANGELOG.md | cut -d: -f1)
          sed -i "${LINE}i ## [Unreleased]\n\n---\n" CHANGELOG.md

          # Update [Unreleased] diff link at the bottom
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          REPO_URL=$(git remote get-url origin | sed 's/\.git$//')
          if [ -n "$PREV_TAG" ] && grep -q "^\[Unreleased\]:" CHANGELOG.md; then
            sed -i "s|^\[Unreleased\]:.*|\[Unreleased\]: ${REPO_URL}/compare/v${NEW_VER}...HEAD|" CHANGELOG.md
            sed -i "/^\[Unreleased\]:/a [${NEW_VER}]: ${REPO_URL}/compare/${PREV_TAG}...v${NEW_VER}" CHANGELOG.md
          fi

          git add src/openwealth_mcp/__init__.py CHANGELOG.md
          git commit -m "chore: release v${NEW_VER}"

      - name: Push release branch and tag
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          BRANCH="${{ steps.release-branch.outputs.branch }}"
          git push origin "$BRANCH"
          git tag "v${NEW_VER}"
          # This tag push will trigger the push:tags:v* path → build + publish
          git push origin "v${NEW_VER}"

      - name: Open PR to merge release branch into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          BRANCH="${{ steps.release-branch.outputs.branch }}"
          gh pr create \
            --title "chore: release v${NEW_VER}" \
            --body "Automated release bump for **v${NEW_VER}**.

          Changes:
          - \`src/openwealth_mcp/__init__.py\`: version bumped to \`${NEW_VER}\`
          - \`CHANGELOG.md\`: \`[Unreleased]\` promoted to \`[${NEW_VER}]\`

          The publish workflow was already triggered by the \`v${NEW_VER}\` tag push.
          Merge this PR once the publish run succeeds." \
            --base main \
            --head "$BRANCH"

  # ── Job 2: build wheel + sdist ─────────────────────────────────────────────
  # Runs ONLY on tag push (v*); never on workflow_dispatch.
  build:
    name: Build distribution
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openwealth-mcp'))")"
          echo "Tag: $TAG  Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Check distributions
        run: uv run --with twine twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # ── Job 3: publish to TestPyPI ─────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Job 4: publish to PyPI ─────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
