name: Publish to PyPI

# Triggered either by:
#   1. A manual workflow_dispatch (bumps version, commits, tags, then publishes)
#   2. A direct "v*" tag push (skips the bump job, builds & publishes as-is)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when 'version' is set)"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Exact version to release, e.g. 1.0.0 (overrides 'bump')"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── Job 1: bump version, commit & push tag ─────────────────────────────────
  # Runs ONLY on workflow_dispatch; skipped on direct tag push.
  bump-and-tag:
    name: Bump version & create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Use a PAT or the default GITHUB_TOKEN; the latter works when
          # "Allow GitHub Actions to create pull requests" is enabled in
          # Settings → Actions → General → Workflow permissions.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install package (editable) to read current version
        run: uv sync --frozen

      - name: Compute & write new version
        id: bump
        run: |
          # Read current version (strips pre-release suffixes like "0.3.0b1")
          CURRENT=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openwealth-mcp'))")
          BASE=$(echo "$CURRENT" | grep -oP '^\d+\.\d+\.\d+')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          EXPLICIT="${{ inputs.version }}"
          BUMP_TYPE="${{ inputs.bump }}"

          if [ -n "$EXPLICIT" ]; then
            NEW_VER="$EXPLICIT"
          elif [ "$BUMP_TYPE" = "major" ]; then
            NEW_VER="$((MAJOR+1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VER="${MAJOR}.$((MINOR+1)).0"
          else
            NEW_VER="${MAJOR}.${MINOR}.$((PATCH+1))"
          fi

          echo "Bumping ${CURRENT} → ${NEW_VER}"

          # Write new version to the single source of truth
          sed -i "s/__version__ = \".*\"/__version__ = \"${NEW_VER}\"/" \
              src/openwealth_mcp/__init__.py

          echo "new_version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG (promote [Unreleased] → [x.y.z])
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          TODAY=$(date +%Y-%m-%d)

          # Replace the [Unreleased] header with the versioned one
          sed -i "s/## \[Unreleased\]/## [${NEW_VER}] — ${TODAY}/" CHANGELOG.md

          # Insert a fresh [Unreleased] section at the top (after the preamble)
          # Find the line number of the newly renamed release header and insert before it
          LINE=$(grep -n "## \[${NEW_VER}\]" CHANGELOG.md | head -1 | cut -d: -f1)
          sed -i "${LINE}i ## [Unreleased]\n\n---\n" CHANGELOG.md

          # Update the [Unreleased] diff link at the bottom
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            REPO_URL=$(git remote get-url origin | sed 's/\.git$//')
            # Replace existing [Unreleased] link or append if missing
            if grep -q "^\[Unreleased\]:" CHANGELOG.md; then
              sed -i "s|^\[Unreleased\]:.*|\[Unreleased\]: ${REPO_URL}/compare/v${NEW_VER}...HEAD|" CHANGELOG.md
              # Add the new version's compare link after the [Unreleased] line
              sed -i "/^\[Unreleased\]:/a [${NEW_VER}]: ${REPO_URL}/compare/${PREV_TAG}...v${NEW_VER}" CHANGELOG.md
            fi
          fi

      - name: Commit, tag & push
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/openwealth_mcp/__init__.py CHANGELOG.md
          git commit -m "chore: release v${NEW_VER}"
          git tag "v${NEW_VER}"
          git push origin HEAD --tags

  # ── Job 2: build wheel + sdist ─────────────────────────────────────────────
  build:
    name: Build distribution
    needs: [bump-and-tag]
    # Run after a successful bump, OR directly on a tag push (bump is skipped).
    if: |
      always() &&
      (github.event_name == 'push' ||
       needs.bump-and-tag.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # On workflow_dispatch the bump job already pushed the tag; check out
          # the latest commit (which carries the new __version__).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump-and-tag.outputs.new_version) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openwealth-mcp'))")"
          echo "Tag: $TAG  Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Check distributions
        run: uv run --with twine twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # ── Job 3: publish to TestPyPI ─────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Job 4: publish to PyPI ─────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
